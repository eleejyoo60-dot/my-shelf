<!doctype html>
<meta charset="utf-8">
<style>
  body { margin: 0; background: #f1efec; font-family: sans-serif; }
  #shelf { display: flex; align-items: flex-end; gap: 2px;
           padding: 30px 20px 0; border-bottom: 14px solid #4a2c1a;
           overflow-x: auto; }
  .book { writing-mode: vertical-rl; display: flex; align-items: center;
          justify-content: center; color: #fff; font-size: 13px;
          padding: 8px 0; border-radius: 2px; white-space: nowrap;
          transition: transform .15s; cursor: pointer; }
  .book:hover { transform: translateY(-8px); }
</style>
<div id="shelf"></div>
<script>
fetch("/api/books").then(r => r.json()).then(books => {
  const shelf = document.getElementById("shelf");
  books.forEach(b => {
    const el = document.createElement("div");
    el.className = "book";
    el.textContent = b.title;
    el.title = b.title + " / " + b.author;
    el.style.background = b.color;
    el.style.height = b.height + "px";
    el.style.width = Math.max(22, Math.min(60, b.pages / 9)) + "px";
    shelf.appendChild(el);
  });
});
</script>
